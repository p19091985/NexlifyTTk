title = "NexlifyTTk: regras padrão e credenciais legadas"
[extend]
useDefault = true

[[rules]]
id = "nexlify-fernet-key"
description = "Chave Fernet em arquivo de chave"
path = '''(?i)(secret\.key|keyring\.json)$'''
regex = '''[A-Za-z0-9_-]{43}='''

[[rules]]
id = "nexlify-published-password-hash"
description = "Hash bcrypt publicado em seed ou código"
regex = '''\$2[aby]\$[0-9]{2}\$[./A-Za-z0-9]{53}'''
